:root { --font-geist-sans: Geist; --font-geist-mono: "Geist Mono"; }
.offline-demo-note { flex-basis: 100%; color: var(--muted); max-width: 54ch; }
.offline-demo-note summary { cursor: pointer; width: fit-content; }
.offline-demo-note p { margin: 8px 0; line-height: 1.6; }
.offline-vocabulary-source > .secondary-button { margin: 2px 9px 4px; }
.library-tree details button:disabled {
  background: transparent;
  color: #736d66;
  cursor: default;
}
.library-tree details button:disabled i { color: #736d66; font-size: 10px; }

.demo-library-content { flex: 1; min-height: 0; overflow-y: auto; }
.demo-library-content .library-tree { overflow: visible; }
.demo-featured {
  display: grid;
  gap: 5px;
  margin: 0 14px 14px;
}
.demo-featured h2 {
  color: var(--muted);
  font-size: 12px;
  font-weight: 650;
  margin: 0 6px 2px;
}
.demo-featured button {
  min-height: 38px;
  padding: 7px 10px;
  text-align: left;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  color: var(--ink);
  font-size: 13px;
  cursor: pointer;
}
.demo-featured button:hover,
.demo-featured button[aria-current="true"] {
  background: var(--accent-soft);
  border-color: #e5c1af;
  color: #87472f;
}
.demo-featured button[aria-current="true"] { font-weight: 680; }
.library-tree .demo-catalog > .demo-catalog__body { padding: 0 0 5px; }
.demo-catalog__body > p { padding: 0 10px 8px; color: var(--muted); font-size: 12px; }
.library-tree details button.is-directory-only { color: #736d66; background: #f6f4f1; }
.library-tree details button.is-directory-only:hover { background: #eeebe6; color: #59544e; }
.library-tree details button.is-directory-only i { color: inherit; font-size: 10px; }
.demo-guide {
  display: grid;
  gap: 8px;
  margin: 0 0 16px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--panel);
  color: #605b55;
  font-size: 13px;
  line-height: 1.45;
}
.demo-guide__header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.demo-guide__header h2 { font-size: 15px; font-weight: 700; color: var(--ink); }
.demo-guide__note { margin: 0; }
.demo-guide__articles, .demo-guide__actions { display: flex; flex-wrap: wrap; gap: 6px 9px; }
.demo-guide button {
  min-height: 32px;
  padding: 3px 7px;
  border-radius: 6px;
  color: #87472f;
  font-weight: 680;
  text-align: left;
  cursor: pointer;
}
.demo-guide button:hover { background: var(--accent-soft); }
.demo-guide button:disabled { color: var(--muted); cursor: default; }
.demo-guide button.demo-guide__dismiss { border: 1px solid var(--line); white-space: nowrap; }
.demo-guide__articles button { border: 1px solid var(--line); }
.demo-guide__articles button[aria-current="true"] { border-color: #e5c1af; background: var(--accent-soft); }
.demo-guide__steps {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 4px 18px;
  list-style: decimal;
  padding-inline-start: 19px;
  margin: 0;
}

<body class="antialiased">

  <noscript>请启用 JavaScript 体验逐句精读。两篇样例提供在线播放。</noscript>
  <script id="demo-sample" type="application/json">{"articles":[{"text":"Ruth Simmons joined Goldman Sachs's board as an outside director in January 2000; a year later she became president of Brown University. For the rest of the decade she apparently managed both roles without attracting much criticism. But by the end of 2009 Ms. Simmons was under fire for having sat on Goldman's compensation committee; how could she have let those enormous bonus payouts pass unremarked? By February the next year Ms. Simmons had left the board. The position was just taking up too much time, she said.\n\nOutside directors are supposed to serve as helpful, yet less biased, advisers on a firm's board. Having made their wealth and their reputations elsewhere, they presumably have enough independence to disagree with the chief executive's proposals. If the sky, and the share price, is falling, outside directors should be able to give advice based on having weathered their own crises.\n\nThe researchers from Ohio University used a database that covered more than 10,000 firms and more than 64,000 different directors between 1989 and 2004. Then they simply checked which directors stayed from one proxy statement to the next. The most likely reason for departing a board was age, so the researchers concentrated on those \"surprise\" disappearances by directors under the age of 70. They found that after a surprise departure, the probability that the company will subsequently have to restate earnings increases by nearly 20%. The likelihood of being named in a federal class-action lawsuit also increases, and the stock is likely to perform worse. The effect tended to be larger for larger firms. Although a correlation between them leaving and subsequent bad performance at the firm is suggestive, it does not mean that such directors are always jumping off a sinking ship. Often they \"trade up,\" leaving riskier, smaller firms for larger and more stable firms.\n\nBut the researchers believe that outside directors have an easier time of avoiding a blow to their reputations if they leave a firm before bad news breaks, even if a review of history shows that they were on the board at the time any wrongdoing occurred. Firms who want to keep their outside directors through tough times may have to create incentives. Otherwise outside directors will follow the example of Ms. Simmons, once again very popular on campus.\n","audio":"./audio/2011-reading-text1.mp3","sentences":[{"id":"2011-reading-text1-s001","text":"Ruth Simmons joined Goldman Sachs's board as an outside director in January 2000; a year later she became president of Brown University.","translation":"2000年1月，露丝·西蒙斯以外部董事身份加入高盛董事会；一年后，她成为布朗大学校长。","paragraph":0,"start":0.102,"end":8.835,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s002","text":"For the rest of the decade she apparently managed both roles without attracting much criticism.","translation":"在这十年的余下时间里，她似乎兼顾了这两个职位，没有招致太多批评。","paragraph":0,"start":9.663,"end":15.44,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s003","text":"But by the end of 2009 Ms. Simmons was under fire for having sat on Goldman's compensation committee; how could she have let those enormous bonus payouts pass unremarked?","translation":"但到2009年底，西蒙斯女士因曾任高盛薪酬委员会委员而受到抨击：她怎么能让那些巨额奖金支出在无人质疑的情况下通过呢？","paragraph":0,"start":16.254,"end":26.041,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s004","text":"By February the next year Ms. Simmons had left the board.","translation":"到次年2月，西蒙斯女士已经离开董事会。","paragraph":0,"start":26.863,"end":30.172,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s005","text":"The position was just taking up too much time, she said.","translation":"她说，这个职位只是占用了太多时间。","paragraph":0,"start":30.983,"end":34.505,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s006","text":"Outside directors are supposed to serve as helpful, yet less biased, advisers on a firm's board.","translation":"外部董事应在公司董事会中担任能提供帮助、同时较少带有偏见的顾问。","paragraph":1,"start":35.379,"end":41.313,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s007","text":"Having made their wealth and their reputations elsewhere, they presumably have enough independence to disagree with the chief executive's proposals.","translation":"他们在其他领域积累了财富和声誉，因此理应拥有足够的独立性，敢于反对首席执行官的提议。","paragraph":1,"start":42.128,"end":50.28,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s008","text":"If the sky, and the share price, is falling, outside directors should be able to give advice based on having weathered their own crises.","translation":"如果公司形势和股价一同急转直下，外部董事应当能够凭借自己曾安然渡过危机的经验提出建议。","paragraph":1,"start":51.073,"end":59.526,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s009","text":"The researchers from Ohio University used a database that covered more than 10,000 firms and more than 64,000 different directors between 1989 and 2004.","translation":"俄亥俄大学的研究人员使用了一个数据库，其中涵盖1989年至2004年间一万多家公司和六万四千多名不同董事。","paragraph":2,"start":60.465,"end":71.328,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s010","text":"Then they simply checked which directors stayed from one proxy statement to the next.","translation":"随后，他们只需比较前后两份股东委托投票说明书，看看哪些董事仍然留任。","paragraph":2,"start":72.126,"end":77.478,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s011","text":"The most likely reason for departing a board was age, so the researchers concentrated on those \"surprise\" disappearances by directors under the age of 70.","translation":"董事离任最可能的原因是年龄，因此研究人员重点考察了70岁以下董事那些“出人意料”的离职。","paragraph":2,"start":78.288,"end":87.716,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s012","text":"They found that after a surprise departure, the probability that the company will subsequently have to restate earnings increases by nearly 20%.","translation":"他们发现，董事意外离职后，公司随后不得不重述盈利数据的概率增加了近20%。","paragraph":2,"start":88.55,"end":97.642,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s013","text":"The likelihood of being named in a federal class-action lawsuit also increases, and the stock is likely to perform worse.","translation":"公司被列为联邦集体诉讼当事方的可能性也会上升，股票表现也可能变差。","paragraph":2,"start":98.462,"end":105.574,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s014","text":"The effect tended to be larger for larger firms.","translation":"这种影响在规模较大的公司中往往更为明显。","paragraph":2,"start":106.375,"end":109.402,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s015","text":"Although a correlation between them leaving and subsequent bad performance at the firm is suggestive, it does not mean that such directors are always jumping off a sinking ship.","translation":"尽管董事离职与公司随后表现不佳之间的相关性颇具启示意义，但这并不意味着这些董事总是在逃离一艘正在下沉的船。","paragraph":2,"start":110.2,"end":120.48,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s016","text":"Often they \"trade up,\" leaving riskier, smaller firms for larger and more stable firms.","translation":"他们往往是换到了更好的去处，离开风险更高、规模更小的公司，转到更大、更稳定的公司。","paragraph":2,"start":121.289,"end":126.66,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s017","text":"But the researchers believe that outside directors have an easier time of avoiding a blow to their reputations if they leave a firm before bad news breaks, even if a review of history shows that they were on the board at the time any wrongdoing occurred.","translation":"但研究人员认为，只要外部董事在坏消息爆发前离开公司，就更容易避免声誉受损，即使事后回顾历史会发现，任何不当行为发生时他们其实都在董事会任职。","paragraph":3,"start":127.564,"end":142.333,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s018","text":"Firms who want to keep their outside directors through tough times may have to create incentives.","translation":"希望外部董事在困难时期仍然留任的公司，或许必须设置激励措施。","paragraph":3,"start":143.137,"end":148.413,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2011-reading-text1-s019","text":"Otherwise outside directors will follow the example of Ms. Simmons, once again very popular on campus.","translation":"否则，外部董事就会效仿西蒙斯女士。她如今又成了校园里很受欢迎的人物。","paragraph":3,"start":149.214,"end":155.478,"startStatus":"calibrated","endStatus":"calibrated"}],"vocabulary":[{"sourceText":"outside director","normalizedForm":"outside director","entryType":"phrase","partOfSpeech":"","meaning":"外部董事","reviewStatus":"ok","reviewNote":""},{"sourceText":"board","normalizedForm":"board","entryType":"word","partOfSpeech":"n.","meaning":"董事会","reviewStatus":"ok","reviewNote":""},{"sourceText":"attracting much criticism","normalizedForm":"attract criticism","entryType":"phrase","partOfSpeech":"","meaning":"招致批评","reviewStatus":"ok","reviewNote":""},{"sourceText":"under fire","normalizedForm":"be under fire","entryType":"phrase","partOfSpeech":"","meaning":"受到抨击","reviewStatus":"ok","reviewNote":""},{"sourceText":"compensation committee","normalizedForm":"compensation committee","entryType":"phrase","partOfSpeech":"","meaning":"薪酬委员会","reviewStatus":"ok","reviewNote":""},{"sourceText":"pass unremarked","normalizedForm":"pass unremarked","entryType":"phrase","partOfSpeech":"","meaning":"未引起注意或评论就过去","reviewStatus":"ok","reviewNote":""},{"sourceText":"taking up","normalizedForm":"take up","entryType":"phrase","partOfSpeech":"","meaning":"占用（时间）","reviewStatus":"ok","reviewNote":""},{"sourceText":"biased","normalizedForm":"biased","entryType":"word","partOfSpeech":"adj.","meaning":"有偏见的","reviewStatus":"ok","reviewNote":""},{"sourceText":"disagree with","normalizedForm":"disagree with","entryType":"phrase","partOfSpeech":"","meaning":"不同意","reviewStatus":"ok","reviewNote":""},{"sourceText":"weathered","normalizedForm":"weather","entryType":"word","partOfSpeech":"v.","meaning":"安然度过（困境）","reviewStatus":"ok","reviewNote":""},{"sourceText":"proxy statement","normalizedForm":"proxy statement","entryType":"phrase","partOfSpeech":"","meaning":"股东委托投票说明书","reviewStatus":"ok","reviewNote":""},{"sourceText":"restate earnings","normalizedForm":"restate earnings","entryType":"phrase","partOfSpeech":"","meaning":"重述盈利数据","reviewStatus":"ok","reviewNote":""},{"sourceText":"class-action lawsuit","normalizedForm":"class-action lawsuit","entryType":"phrase","partOfSpeech":"","meaning":"集体诉讼","reviewStatus":"ok","reviewNote":""},{"sourceText":"jumping off a sinking ship","normalizedForm":"jump off a sinking ship","entryType":"phrase","partOfSpeech":"","meaning":"在局势恶化前抽身","reviewStatus":"ok","reviewNote":""},{"sourceText":"trade up","normalizedForm":"trade up","entryType":"phrase","partOfSpeech":"","meaning":"换到更好的去处","reviewStatus":"ok","reviewNote":""},{"sourceText":"a blow to their reputations","normalizedForm":"a blow to one's reputation","entryType":"phrase","partOfSpeech":"","meaning":"对声誉的打击","reviewStatus":"ok","reviewNote":""},{"sourceText":"incentives","normalizedForm":"incentive","entryType":"word","partOfSpeech":"n.","meaning":"激励措施","reviewStatus":"ok","reviewNote":""},{"sourceText":"follow the example of","normalizedForm":"follow the example of","entryType":"phrase","partOfSpeech":"","meaning":"效仿","reviewStatus":"ok","reviewNote":""}],"id":"2011-reading-text1","year":"2011","section":"reading-text1","sectionLabel":"阅读 Text 1","title":"2011 · 阅读 Text 1","audioName":"2011-reading-text1.mp3","questions":[{"questionNo":21,"stem":"According to Paragraph 1, Ms. Simmons was criticized for .","answer":"B","options":[{"label":"A","source":"gaining excessive profits"},{"label":"B","source":"failing to fulfill her duty"},{"label":"C","source":"refusing to make compromises"},{"label":"D","source":"leaving the board in tough times"}]},{"questionNo":22,"stem":"We learn from Paragraph 2 that outside directors are supposed to be .","answer":"D","options":[{"label":"A","source":"generous investors"},{"label":"B","source":"unbiased executives"},{"label":"C","source":"share price forecasters"},{"label":"D","source":"independent advisers"}]},{"questionNo":23,"stem":"According to the researchers from Ohio University, after an outside director’s surprise departure, the firm is likely to .","answer":"C","options":[{"label":"A","source":"become more stable"},{"label":"B","source":"report increased earnings"},{"label":"C","source":"do less well in the stock market"},{"label":"D","source":"perform worse in lawsuits"}]},{"questionNo":24,"stem":"It can be inferred from the last paragraph that outside directors .","answer":"A","options":[{"label":"A","source":"may stay for the attractive offers from the firm"},{"label":"B","source":"have often had records of wrongdoings in the firm"},{"label":"C","source":"are accustomed to stress-free work in the firm"},{"label":"D","source":"will decline incentives from the firm"}]},{"questionNo":25,"stem":"The author’s attitude toward the role of outside directors is .","answer":"D","options":[{"label":"A","source":"permissive"},{"label":"B","source":"positive"},{"label":"C","source":"scornful"},{"label":"D","source":"critical"}]}],"audioDuration":156.264},{"id":"2012-reading-text2","year":"2012","section":"reading-text2","sectionLabel":"阅读 Text 2","title":"2012 · 阅读 Text 2","audioName":"2012-reading-text2.mp3","audio":"./audio/2012-reading-text2.mp3","text":"Pretty in pink: adult women do not remember being so obsessed with the colour, yet it is pervasive in our young girls' lives. It is not that pink is intrinsically bad, but it is such a tiny slice of the rainbow and, though it may celebrate girlhood in one way, it also repeatedly and firmly fuses girls' identity to appearance. Then it presents that connection, even among two-year-olds, between girls as not only innocent but as evidence of innocence. Looking around, I despaired at the singular lack of imagination about girls' lives and interests.\n\nGirls' attraction to pink may seem unavoidable, somehow encoded in their DNA, but according to Jo Paoletti, an associate professor of American Studies, it is not. Children were not colour-coded at all until the early 20th century: in the era before domestic washing machines all babies wore white as a practical matter, since the only way of getting clothes clean was to boil them. What's more, both boys and girls wore what were thought of as gender-neutral dresses. When nursery colours were introduced, pink was actually considered the more masculine colour, a pastel version of red, which was associated with strength. Blue, with its intimations of the Virgin Mary, constancy and faithfulness, symbolised femininity. It was not until the mid-1980s, when amplifying age and sex differences became a dominant children's marketing strategy, that pink fully came into its own, when it began to seem inherently attractive to girls, part of what defined them as female, at least for the first few critical years.\n\nI had not realised how profoundly marketing trends dictated our perception of what is natural to kids, including our core beliefs about their psychological development. Take the toddler. I assumed that phase was something experts developed after years of research into children's behaviour: wrong. Turns out, according to Daniel Cook, a historian of childhood consumerism, it was popularised as a marketing trick by clothing manufacturers in the 1930s.\n\nTrade publications counselled department stores that, in order to increase sales, they should create a \"third stepping stone\" between infant wear and older kids' clothes. It was only after \"toddler\" became a common shoppers' term that it evolved into a broadly accepted developmental stage. Splitting kids, or adults, into ever-tinier categories has proved a sure-fire way to boost profits. And one of the easiest ways to segment a market is to magnify gender differences-or invent them where they did not previously exist.\n","sentences":[{"id":"2012-reading-text2-s001","text":"Pretty in pink: adult women do not remember being so obsessed with the colour, yet it is pervasive in our young girls’ lives.","translation":"粉红色看起来很漂亮：成年女性并不记得自己小时候曾如此迷恋这种颜色，但如今粉红色却充斥着小女孩的生活。","paragraph":0,"start":0.118,"end":7.54,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s002","text":"It is not that pink is intrinsically bad, but it is such a tiny slice of the rainbow and, though it may celebrate girlhood in one way, it also repeatedly and firmly fuses girls’ identity to appearance.","translation":"并不是说粉红色本身不好，而是它只占彩虹中极小的一部分；尽管它可能以某种方式赞美女孩身份，却也反复而牢固地把女孩的身份与外表绑定在一起。","paragraph":0,"start":8.347,"end":20.386,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s003","text":"Then it presents that connection, even among two-year-olds, between girls as not only innocent but as evidence of innocence.","translation":"于是，即使对两岁的孩子而言，这种联系也把女孩与天真绑定起来，甚至把女孩本身当成天真的证明。","paragraph":0,"start":21.182,"end":28.665,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s004","text":"Looking around, I despaired at the singular lack of imagination about girls’ lives and interests.","translation":"环顾四周，我对人们在女孩生活和兴趣方面惊人地缺乏想象力感到绝望。","paragraph":0,"start":29.474,"end":35.123,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s005","text":"Girls’ attraction to pink may seem unavoidable, somehow encoded in their DNA, but according to Jo Paoletti, an associate professor of American Studies, it is not.","translation":"女孩对粉红色的喜爱看起来似乎不可避免，仿佛被编码进DNA里，但美国研究副教授乔·保莱蒂认为事实并非如此。","paragraph":1,"start":36.053,"end":46.481,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s006","text":"Children were not colour-coded at all until the early 20th century: in the era before domestic washing machines all babies wore white as a practical matter, since the only way of getting clothes clean was to boil them.","translation":"直到20世纪初，儿童根本没有按颜色区分性别：在家用洗衣机出现之前，出于实际考虑，所有婴儿都穿白色，因为当时把衣服洗干净的唯一办法就是煮洗。","paragraph":1,"start":47.26,"end":60.667,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s007","text":"What’s more, both boys and girls wore what were thought of as gender-neutral dresses.","translation":"而且，男孩女孩都穿当时被认为是性别中性的裙装。","paragraph":1,"start":61.454,"end":66.121,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s008","text":"When nursery colours were introduced, pink was actually considered the more masculine colour, a pastel version of red, which was associated with strength.","translation":"当育儿颜色体系被引入时，粉红色实际上被认为更有男子气概，因为它是红色的淡色版本，而红色与力量相关。","paragraph":1,"start":66.926,"end":76.078,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s009","text":"Blue, with its intimations of the Virgin Mary, constancy and faithfulness, symbolised femininity.","translation":"蓝色因让人联想到圣母玛利亚、坚贞和忠诚，反而象征女性气质。","paragraph":1,"start":76.907,"end":83.429,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s010","text":"It was not until the mid-1980s, when amplifying age and sex differences became a dominant children’s marketing strategy, that pink fully came into its own, when it began to seem inherently attractive to girls, part of what defined them as female, at least for the first few critical years.","translation":"直到20世纪80年代中期，当放大年龄和性别差异成为儿童营销的主导策略时，粉红色才真正占据如今的位置：它开始显得天生吸引女孩，并成为界定她们女性身份的一部分，至少在最初几个关键年份如此。","paragraph":1,"start":84.256,"end":102.254,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s011","text":"I had not realised how profoundly marketing trends dictated our perception of what is natural to kids, including our core beliefs about their psychological development.","translation":"我以前没有意识到，营销趋势竟如此深刻地支配着我们对儿童何为“自然”的认识，其中甚至包括我们对其心理发展的核心信念。","paragraph":2,"start":103.168,"end":112.956,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s012","text":"Take the toddler.","translation":"以“学步儿童”这一概念为例。","paragraph":2,"start":113.744,"end":114.92,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s013","text":"I assumed that phase was something experts developed after years of research into children’s behaviour: wrong.","translation":"我原以为这一阶段是专家经过多年儿童行为研究后提出的：错了。","paragraph":2,"start":115.753,"end":122.328,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s014","text":"Turns out, according to Daniel Cook, a historian of childhood consumerism, it was popularised as a marketing trick by clothing manufacturers in the 1930s.","translation":"童年消费史学者丹尼尔·库克指出，事实是这一概念在20世纪30年代被服装制造商作为营销手段推广开来。","paragraph":2,"start":123.088,"end":133.298,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s015","text":"Trade publications counselled department stores that, in order to increase sales, they should create a “third stepping stone” between infant wear and older kids’ clothes.","translation":"行业刊物建议百货商店，为了增加销量，应在婴儿服装与大龄儿童服装之间创造一个“第三块踏脚石”。","paragraph":3,"start":134.225,"end":144.236,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s016","text":"It was only after “toddler” became a common shoppers’ term that it evolved into a broadly accepted developmental stage.","translation":"直到“toddler”成为购物者常用的术语后，它才逐渐演变为一个被广泛接受的发展阶段。","paragraph":3,"start":145.049,"end":151.973,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s017","text":"Splitting kids, or adults, into ever-tinier categories has proved a sure-fire way to boost profits.","translation":"事实证明，把儿童或成年人划分为越来越细小的类别，是提高利润的可靠办法。","paragraph":3,"start":152.758,"end":159.36,"startStatus":"calibrated","endStatus":"calibrated"},{"id":"2012-reading-text2-s018","text":"And one of the easiest ways to segment a market is to magnify gender differences—or invent them where they did not previously exist.","translation":"而细分市场最容易的办法之一，就是放大性别差异——或者在原本没有差异的地方创造差异。","paragraph":3,"start":160.182,"end":168.122,"startStatus":"calibrated","endStatus":"calibrated"}],"questions":[{"questionNo":26,"stem":"By saying “it is...the rainbow” (Para.1), the author means pink .","answer":"C","options":[{"label":"A","source":"cannot explain girls’ lack of imagination"},{"label":"B","source":"should not be associated with girls’ innocence"},{"label":"C","source":"should not be the sole representation of girlhood"},{"label":"D","source":"cannot influence girls’ lives and interests"}]},{"questionNo":27,"stem":"According to Paragraph 2, which of the following is true of colours?","answer":"B","options":[{"label":"A","source":"Colours are encoded in girls’ DNA."},{"label":"B","source":"Blue used to be regarded as the colour for girls."},{"label":"C","source":"White is preferred by babies."},{"label":"D","source":"Pink used to be a neutral colour in symbolising genders."}]},{"questionNo":28,"stem":"The author suggests that our perception of children’s psychological development was much influenced by .","answer":"B","options":[{"label":"A","source":"the observation of children’s nature"},{"label":"B","source":"the marketing of products for children"},{"label":"C","source":"researches into children’s behaviour"},{"label":"D","source":"studies of childhood consumption"}]},{"questionNo":29,"stem":"We may learn from Paragraph 4 that department stores were advised to .","answer":"A","options":[{"label":"A","source":"classify consumers into smaller groups"},{"label":"B","source":"attach equal importance to different genders"},{"label":"C","source":"focus on infant wear and older kids’ clothes"},{"label":"D","source":"create some common shoppers’ terms"}]},{"questionNo":30,"stem":"It can be concluded that girls’ attraction to pink seems to be .","answer":"C","options":[{"label":"A","source":"fully understood by clothing manufacturers"},{"label":"B","source":"clearly explained by their inborn tendency"},{"label":"C","source":"mainly imposed by profit-driven businessmen"},{"label":"D","source":"well interpreted by psychological experts"}]}],"vocabulary":[{"sourceText":"obsessed with","normalizedForm":"be obsessed with","entryType":"phrase","partOfSpeech":"","meaning":"迷恋，过度关注","reviewStatus":"ok","reviewNote":""},{"sourceText":"pervasive","normalizedForm":"pervasive","entryType":"word","partOfSpeech":"adj.","meaning":"无处不在的，普遍存在的","reviewStatus":"ok","reviewNote":""},{"sourceText":"intrinsically","normalizedForm":"intrinsically","entryType":"word","partOfSpeech":"adv.","meaning":"本质上，内在地","reviewStatus":"ok","reviewNote":""},{"sourceText":"came into its own","normalizedForm":"come into one's own","entryType":"phrase","partOfSpeech":"","meaning":"真正发挥影响，开始占据应有的位置","reviewStatus":"ok","reviewNote":""},{"sourceText":"toddler","normalizedForm":"toddler","entryType":"word","partOfSpeech":"n.","meaning":"蹒跚学步的幼儿","reviewStatus":"ok","reviewNote":""},{"sourceText":"segment a market","normalizedForm":"segment a market","entryType":"phrase","partOfSpeech":"","meaning":"细分市场","reviewStatus":"ok","reviewNote":""},{"sourceText":"sure-fire","normalizedForm":"sure-fire","entryType":"word","partOfSpeech":"adj.","meaning":"必定奏效的，稳妥的","reviewStatus":"ok","reviewNote":""}],"audioDuration":168.912}],"seeds":{"2011-reading-text1":["biased","board","incentive","outside director","proxy statement","restate earnings"],"2012-reading-text2":["be obsessed with","come into one's own","intrinsically","pervasive","segment a market","toddler"]},"online":true}</script>
